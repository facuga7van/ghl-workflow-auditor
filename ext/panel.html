<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GHL Audit</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#252a34; --txt:#e6e8ec; --dim:#8b93a1;
    --acc:#5b9dff; --ok:#3fb950; --hi:#f85149; --md:#d29922; --lo:#6e7681;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 22px 80px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--dim);margin:0 0 16px;font-size:13.5px}
  .row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
  button{background:var(--acc);color:#06090f;border:0;border-radius:7px;padding:8px 15px;
       font-weight:650;font-size:13px;cursor:pointer;font-family:inherit}
  button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
  .hint{color:var(--dim);font-size:12.5px;margin-top:8px}
  .empty{color:var(--dim);font-size:13.5px;padding:18px 0}

  /* filters */
  .bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
       position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 0 9px;
       border-bottom:1px solid var(--line);margin-bottom:4px}
  .chip{border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;
        font-weight:650;cursor:pointer;user-select:none;background:#0b0d12;letter-spacing:.03em}
  .chip.HIGH{color:var(--hi)} .chip.MEDIUM{color:var(--md)} .chip.LOW{color:var(--lo)}
  .chip.off{opacity:.3}
  .chip.plain{color:var(--dim);font-weight:500}
  .chip.plain.on{color:#06090f;background:var(--acc);border-color:var(--acc);font-weight:650}
  #q{flex:1;min-width:160px;background:#0b0d12;border:1px solid var(--line);color:var(--txt);
     border-radius:7px;padding:6px 11px;font:12.5px ui-monospace,Consolas,monospace}
  #q:focus{outline:none;border-color:var(--acc)}
  .shown{color:var(--dim);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}

  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:4px}
  th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
     position:sticky;top:41px;background:var(--bg);z-index:2}
  td a{color:var(--acc);text-decoration:none}
  td a:hover{text-decoration:underline}
  .sev{font-weight:700;font-size:11px;letter-spacing:.04em;white-space:nowrap}
  .HIGH{color:var(--hi)} .MEDIUM{color:var(--md)} .LOW{color:var(--lo)}
  .live{color:var(--dim);font-size:11.5px}
  .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
  h4{font-size:13.5px;margin:22px 0 0;font-weight:650}
  h4 .count{color:var(--dim);font-weight:500;font-size:11.5px;margin-left:6px}
  button.copy{background:transparent;border:1px solid var(--line);color:var(--dim);
       border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:500;margin-left:6px;
       opacity:0;transition:opacity .12s}
  tr:hover button.copy{opacity:1}
  button.copy:hover{color:var(--acc);border-color:var(--acc)}

  code{background:#0b0d12;padding:1.5px 5px;border-radius:4px;font-size:12px;
       font-family:ui-monospace,Consolas,monospace}
  pre{background:#0b0d12;border:1px solid var(--line);border-radius:7px;padding:14px;
      overflow:auto;font-size:12.5px;line-height:1.65}
  h3{font-size:15px;margin:30px 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .stat{display:flex;gap:24px;flex-wrap:wrap;margin:6px 0 14px}
  .stat div{font-size:12.5px;color:var(--dim)}
  .stat b{display:block;font-size:21px;color:var(--txt);font-weight:650;line-height:1.25}
  .note{border-left:2px solid var(--line);padding-left:12px;color:var(--dim);font-size:12.5px;margin:14px 0}
  #changed ul{margin:6px 0;padding-left:20px;font-size:13.5px}
  #changed li{margin:3px 0}
  .demo{color:var(--md);font-size:11px;letter-spacing:.08em;
        border:1px solid var(--md);border-radius:4px;padding:1px 6px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>GHL Audit</h1>
  <p class="sub" id="head"></p>

  <div class="row hidden" id="actions">
    <button id="dlmd">Download report (.md)</button>
    <button id="cpmd" class="ghost">Copy .md</button>
    <button id="dljson" class="ghost">Download full data (.json)</button>
    <button id="cpjson" class="ghost">Copy .json</button>
  </div>

  <div class="stat" id="stats"></div>
  <div id="changed" class="hidden"></div>

  <h3>Findings</h3>
  <div class="bar hidden" id="filters">
    <span class="chip HIGH" id="fHIGH">HIGH</span>
    <span class="chip MEDIUM" id="fMEDIUM">MEDIUM</span>
    <span class="chip LOW" id="fLOW">LOW</span>
    <span class="chip plain" id="flive">published only</span>
    <span class="chip plain" id="fgroup">group by workflow</span>
    <input id="q" placeholder="filter by workflow, rule or text">
    <span class="shown" id="shown"></span>
  </div>
  <div id="findings"></div>

  <div id="graph"></div>
  <div id="inventory"></div>
</div>
<script src="core.js"></script>
<script src="demo.js"></script>
<script src="panel.js"></script>
</body>
</html>
