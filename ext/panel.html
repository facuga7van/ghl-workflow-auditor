<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GHL Audit</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#252a34; --txt:#e6e8ec; --dim:#8b93a1;
    --acc:#5b9dff; --ok:#3fb950; --hi:#f85149; --md:#d29922; --lo:#6e7681;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:36px 22px 80px}
  h1{font-size:23px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--dim);margin:0 0 18px;font-size:13.5px}
  .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
  button{background:var(--acc);color:#06090f;border:0;border-radius:7px;padding:9px 16px;
       font-weight:650;font-size:13.5px;cursor:pointer;font-family:inherit}
  button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
  .hint{color:var(--dim);font-size:12.5px;margin-top:8px}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
  th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
  .sev{font-weight:700;font-size:11px;letter-spacing:.04em;white-space:nowrap}
  .HIGH{color:var(--hi)} .MEDIUM{color:var(--md)} .LOW{color:var(--lo)}
  code{background:#0b0d12;padding:1.5px 5px;border-radius:4px;font-size:12px;
       font-family:ui-monospace,Consolas,monospace}
  pre{background:#0b0d12;border:1px solid var(--line);border-radius:7px;padding:14px;
      overflow:auto;font-size:12.5px;line-height:1.65}
  h3{font-size:15px;margin:26px 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .stat{display:flex;gap:26px;flex-wrap:wrap;margin:4px 0 10px}
  .stat div{font-size:12.5px;color:var(--dim)}
  .stat b{display:block;font-size:22px;color:var(--txt);font-weight:650;line-height:1.25}
  .note{border-left:2px solid var(--line);padding-left:12px;color:var(--dim);font-size:12.5px;margin:14px 0}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>GHL Audit</h1>
  <p class="sub" id="head"></p>
  <div class="row">
    <button id="dlmd" class="hidden">Download report (.md)</button>
    <button id="dljson" class="ghost hidden">Download full data (.json)</button>
  </div>
  <div id="out"></div>
</div>
<script src="panel.js"></script>
</body>
</html>
